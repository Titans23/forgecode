<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plant Defense Arena</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game-app">
    <header>
      <h1>Plant Defense Arena</h1>
      <p class="subtitle">A browser game inspired by the classic lane-based plant defense style.</p>
    </header>

    <section id="hud" aria-live="polite">
      <span>Sun: <strong id="sun-display">0</strong></span>
      <span>Score: <strong id="score-display">0</strong></span>
      <span>Wave: <strong id="wave-display">1</strong></span>
      <span>Lives: <strong id="lives-display">5</strong></span>
      <span>Next Wave: <strong id="wave-timer">0</strong>s</span>
      <span>Selected: <strong id="selected-name">Pea Shooter</strong></span>
    </section>

    <section id="controls">
      <button id="pauseBtn" data-state="running">Pause</button>
      <button id="restartBtn">Restart</button>
      <button id="shovelBtn" data-plant="shovel">Shovel</button>
    </section>

    <section id="plant-selector" aria-label="Plant palette">
      <button class="plant-card selected" data-plant="pea" data-cost="100">Pea Shooter<br><small>100</small></button>
      <button class="plant-card" data-plant="sun" data-cost="50">Sunflower<br><small>50</small></button>
      <button class="plant-card" data-plant="wall" data-cost="50">Wall-Nut<br><small>50</small></button>
      <button class="plant-card" data-plant="cherry" data-cost="150">Cherry Bomb<br><small>150</small></button>
      <button class="plant-card" data-plant="potato" data-cost="125">Potato Mine<br><small>125</small></button>
    </section>

    <section id="hint">Click a plant card and then click a lawn cell to place it. Click flying suns or spawned sun tokens to collect sunlight.</section>

    <canvas id="game-canvas" width="860" height="580"></canvas>

    <section id="status" aria-live="assertive"></section>
  </main>

  <script src="game.js"></script>
</body>
</html>
