<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>植物大战僵尸（复杂版）</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game">
    <header>
      <h1>植物大战僵尸 · HTML 版</h1>
      <p>一个纯前端可运行的“复杂版”玩法：波次、阳光、植物冷却、僵尸波、子弹、吃豆、吃日常太阳。</p>
    </header>

    <section id="statusBar">
      <span class="chip">阳光：<strong id="sunCount">0</strong></span>
      <span class="chip">波次：<strong id="waveInfo">1 / 6</strong></span>
      <span class="chip">生命：<strong id="livesInfo">5</strong></span>
      <span class="chip">分数：<strong id="scoreInfo">0</strong></span>
      <span id="buttons">
        <button id="startBtn">开始</button>
        <button id="pauseBtn">暂停</button>
        <button id="restartBtn">重开</button>
      </span>
    </section>

    <section id="toolbar"></section>

    <section id="playfield">
      <div id="cells"></div>
      <div id="suns" class="layer"></div>
      <div id="projectiles" class="layer"></div>
      <div id="zombies" class="layer"></div>
      <div id="overlay"><div><div id="overlayText">准备开始！</div><button id="overlayRestart">重新开始</button></div></div>
    </section>

    <section id="footerInfo">提示：先选卡片，再点击格子放置植物。僵尸会按波次出现，击败全部僵尸并坚持到第6波胜利。</section>
  </main>

  <script src="game.js"></script>
</body>
</html>
