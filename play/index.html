<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground - 复杂植物大战僵尸</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="layout">
    <h1>PVZ 风格沙盒（play 目录）</h1>
    <div class="game-wrap">
      <canvas id="gameCanvas" width="916" height="552"></canvas>
      <aside class="side">
        <div class="status" id="status"></div>
        <div class="row">
          <button id="pauseBtn">⏸ 暂停/继续</button>
          <button id="restartBtn">🔁 重新开始</button>
        </div>
        <div class="row row-accent">
          <button id="burstBtn">⚡ 太阳风暴 <small>充能中</small></button>
        </div>
        <div class="cards" id="cards"></div>
        <div class="row">
          <button id="eraseBtn">🧱 铲子（移除）</button>
          <button id="clearBtn">全部清空</button>
        </div>
        <div class="log" id="log"></div>
        <div class="hint">快捷键：1-6 选择植物，E 切换铲子，空格释放太阳风暴，P 暂停，R 重开。优先建立向日葵经济，再用高费植物稳住中后期节奏。</div>
      </aside>
    </div>
  </div>
<script src="./game.js"></script>
</body>
</html>
