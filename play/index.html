<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground - 复杂植物大战僵尸</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="layout">
    <h1>PVZ 风格沙盒（play 目录）</h1>
    <div class="game-wrap">
      <canvas id="gameCanvas" width="916" height="552"></canvas>
      <aside class="side">
        <div class="status" id="status"></div>
        <div class="row">
          <button id="pauseBtn">⏸ 暂停/继续</button>
          <button id="restartBtn">🔁 重新开始</button>
        </div>
        <div class="cards" id="cards"></div>
        <div class="row">
          <button id="eraseBtn">🧱 铲子（移除）</button>
          <button id="clearBtn">全部清空</button>
        </div>
        <div class="log" id="log"></div>
        <div class="hint">操作提示：先点击卡牌选植物，再点击草坪格子种植；右侧可见冷却与阳光。点击阳光球拾取。植物不足/冷却时会自动禁用。</div>
      </aside>
    </div>
  </div>
<script src="./game.js"></script>
</body>
</html>
