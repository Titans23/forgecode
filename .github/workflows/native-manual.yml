name: Protected native and packaged acceptance
on:
  workflow_dispatch:
    inputs:
      layer:
        description: Prepared native devices or native installer build
        type: choice
        required: true
        options: [native, packaged]
permissions:
  contents: read
jobs:
  native:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Titans23/forgecode' && github.ref == 'refs/heads/main' && inputs.layer == 'native'
    environment: forgecode-native-acceptance
    strategy:
      fail-fast: false
      matrix:
        device: [forgecode-windows11-x64, forgecode-ubuntu2204-x11, forgecode-ubuntu2204-wayland, forgecode-ubuntu2404-x11, forgecode-ubuntu2404-wayland]
    runs-on: [self-hosted, '${{ matrix.device }}']
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.5'
          python-version: '3.12.13'
      - run: uv python install 3.12.13
      - run: uv sync --locked --all-groups --all-extras
      - run: npm ci
      - run: uv run --locked python scripts/ci_run.py --layer native
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.device }}
          path: |
            .local/ci/
            .local/implementation/*/*.json
            .local/implementation/*/*.log
            docs/implementation/evidence/
          if-no-files-found: error
  packaged:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Titans23/forgecode' && github.ref == 'refs/heads/main' && inputs.layer == 'packaged'
    environment: forgecode-packaging
    strategy:
      fail-fast: false
      matrix:
        device: [forgecode-windows11-x64, forgecode-ubuntu2204-x11]
    runs-on: [self-hosted, '${{ matrix.device }}']
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.5'
          python-version: '3.12.13'
      - run: uv python install 3.12.13
      - run: uv sync --locked --all-groups --all-extras
      - run: npm ci
      - run: uv run --locked python scripts/ci_run.py --layer packaged
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packaged-${{ matrix.device }}
          path: |
            .local/ci/
            .local/desktop-packages/make/
            .local/implementation/*/*.json
            .local/implementation/*/*.log
            docs/implementation/evidence/
          if-no-files-found: error
