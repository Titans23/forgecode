name: Portable contracts and integration
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.5'
          python-version: '3.12.13'
      - run: uv python install 3.12.13
      - run: uv sync --locked --all-groups --all-extras
      - run: npm ci
      - name: Configure locked Electron sandbox on the trusted Ubuntu runner
        if: matrix.os == 'ubuntu-24.04' && github.event_name == 'push' && github.repository == 'Titans23/forgecode' && github.ref == 'refs/heads/codex/forgecode-v4'
        shell: bash
        run: |
          uv run --no-sync python -c "from pathlib import Path; from scripts.ci_bootstrap import hydrate_electron; import shutil; hydrate_electron(Path.cwd(), Path(shutil.which('node')))"
          helper="$PWD/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper" && test ! -L "$helper"
          sudo chown root:root -- "$helper"
          sudo chmod 4755 -- "$helper"
          test "$(stat -c '%u %a' -- "$helper")" = '0 4755'
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum uv run --no-sync python scripts/ci_run.py --layer portable
      - if: runner.os == 'Windows'
        run: uv run --no-sync python scripts/ci_run.py --layer portable
      - name: Retain actual reports on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-${{ matrix.os }}
          path: |
            .local/ci/
            .local/implementation/*/*.xml
            .local/implementation/*/*.json
            .local/implementation/*/*.log
            docs/implementation/evidence/
          if-no-files-found: error
          retention-days: 14
  dependency-security:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.5'
          python-version: '3.12.13'
      - run: uv python install 3.12.13
      - run: uv sync --locked --all-groups --all-extras
      - run: npm ci
      - run: uv run --no-sync python scripts/impl.py verify --suite security
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actual-dependency-security
          path: |
            .local/implementation/*/*.json
            .local/implementation/*/*.log
            docs/implementation/evidence/
          if-no-files-found: error
