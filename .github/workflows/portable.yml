name: Portable contracts and integration
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.5'
          python-version: '3.12.13'
      - run: uv python install 3.12.13
      - run: uv sync --locked --all-groups --all-extras
      - run: npm ci --ignore-scripts
      - run: uv run --no-sync python scripts/ci_run.py --layer portable
      - name: Retain actual reports on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .local/ci/
            .local/implementation/*/*.xml
            .local/implementation/*/*.json
            .local/implementation/*/*.log
          if-no-files-found: error
          retention-days: 14
  dependency-security:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.5'
          python-version: '3.12.13'
      - run: uv python install 3.12.13
      - run: uv sync --locked --all-groups --all-extras
      - run: npm ci --ignore-scripts
      - run: uv run --no-sync python scripts/build_bridge.py
      - run: uv run --no-sync python scripts/impl.py verify --suite security
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actual-dependency-security
          include-hidden-files: true
          retention-days: 14
          path: |
            .local/implementation/*/*.json
            .local/implementation/*/*.log
  sdk-and-customization:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.5'
          python-version: '3.12.13'
      - run: uv sync --locked --no-dev --extra cli --extra validation
      - run: uv run --no-sync python scripts/check_sdk_install.py --output .local/ci/sdk-install
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: benchmark/comparison
      - run: uv run --no-sync python -m benchmark.comparison.workflow --output .local/ci/pi-comparison
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-customization-${{ matrix.os }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .local/ci/sdk-install/*.json
            .local/ci/sdk-install/*.log
            .local/ci/pi-comparison/*.json
          if-no-files-found: error
