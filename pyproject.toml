[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'forge-code'
version = '0.1.2'
description = 'A terminal-based Agent Harness for reliable software engineering tasks.'
readme = 'README.md'
requires-python = '>=3.12'
dependencies = [
    'pydantic>=2.12,<3',
    'python-dotenv>=1,<2',
    'pyyaml>=6,<7',
    'jsonschema==4.26.0',
]

[project.scripts]
forge = 'forge.launch:main'

[project.optional-dependencies]
anthropic = ['anthropic>=0.116,<0.117']
openai = ['openai>=2.53,<3']
gemini = ['httpx>=0.28,<1']
cli = ['prompt-toolkit>=3.0,<4', 'rich>=13,<15', 'typer>=0.9,<1.0', 'click>=8.1,<9']
mcp = ['mcp>=1.28,<2']
coding = ["pywin32==312; sys_platform == 'win32'"]
validation = ['packaging>=25,<27']
observability = ['httpx>=0.28,<1']
terminal = ['forge-code[anthropic,openai,cli,mcp,coding,validation]']
channels = ['lark-channel-sdk>=1.2,<2']
evaluation = ['harbor==0.18.0']

[tool.setuptools.packages.find]
include = ['forge*', 'evals*', 'benchmark*', 'extensions*']
exclude = ['.local*', '.venv*', '.forge*', 'node_modules*', 'build*', 'update_implementation_pack*', 'benchmark.runs*', 'benchmark..cache*']

[tool.setuptools.package-data]
forge = ['prompts/*.md', 'application/_generated_contracts.json', 'engine/migrations/*.sql', '_sandbox/**/*', '_sandbox/**/.*']

[tool.pytest.ini_options]
testpaths = ['tests']
norecursedirs = ['fixtures']
cache_dir = '.local/cache/pytest'

[tool.ruff]
cache-dir = '.local/cache/ruff'
target-version = 'py312'

[tool.ruff.lint]
select = ['E9', 'F63', 'F7', 'F82']

[tool.mypy]
files = ['forge/messages.py', 'forge/tool_types.py', 'forge/runtime/capabilities.py']
follow_imports = 'skip'
cache_dir = '.local/cache/mypy'

[dependency-groups]
dev = [
    'forge-code[terminal]',
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
