[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'forge-code'
version = '0.1.2'
description = 'A terminal-based Agent Harness for reliable software engineering tasks.'
readme = 'README.md'
requires-python = '>=3.12'
dependencies = [
    'anthropic>=0.116,<0.117',
    'openai>=2.53,<3',
    'pydantic>=2.12,<3',
    'prompt-toolkit>=3.0,<4',
    'python-dotenv>=1,<2',
    "rich>=13,<15",
    'typer>=0.9,<1.0',
    'mcp>=1.28,<2',
    'pyyaml>=6,<7',
    'jsonschema==4.26.0',
    "pywin32==312; sys_platform == 'win32'",
]

[project.scripts]
forge = 'forge.launch:main'

[project.optional-dependencies]
channels = ['lark-channel-sdk>=1.2,<2']
evaluation = ['harbor==0.18.0']

[tool.setuptools.packages.find]
include = ['forge*', 'evals*', 'benchmark*', 'extensions*']
exclude = ['.local*', '.venv*', '.forge*', 'node_modules*', 'build*', 'update_implementation_pack*', 'benchmark.runs*', 'benchmark..cache*']

[tool.setuptools.package-data]
forge = ['prompts/*.md', 'application/_generated_contracts.json', 'engine/migrations/*.sql', '_sandbox/**/*', '_sandbox/**/.*']

[tool.pytest.ini_options]
testpaths = ['tests']
norecursedirs = ['fixtures']
cache_dir = '.local/cache/pytest'

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
