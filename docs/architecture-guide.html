<!doctype html>
<html lang="zh-CN">

  <title>ForgeCode 架构学习手册</title>
  <style>
    :root {
      --paper: #f3f6fa; --panel: #fff; --ink: #172b42; --muted: #566a80;
      --nav: #14263b; --nav-text: #d1deed; --line: #dce5ee; --teal: #086b72;
      --teal-soft: #e5f3f2; --blue: #335ed0; --blue-soft: #eef2fe;
      --amber: #885210; --amber-soft: #fff3dc; --code: #142439; --radius: 16px;
      --shadow: 0 12px 36px rgba(27, 51, 78, .06);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink); background: var(--paper); line-height: 1.7;

    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    a { color: var(--teal); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    :focus-visible { outline: 3px solid #dc8b26; outline-offset: 4px; }
    [hidden] { display: none !important; }

    h1 { font-size: clamp(1.8rem, 3.3vw, 2.65rem); line-height: 1.25; letter-spacing: -.04em; }

    h3 { font-size: 1.04rem; line-height: 1.5; }

    code, pre, .mono { font-family: "Cascadia Code", Consolas, monospace; }

    .skip:focus { top: 8px; }
    .topbar { height: 70px; display: flex; align-items: center; gap: 18px; padding: 0 28px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 15; }

    .sidebar a { color: var(--nav-text); }
    .search-label { display: block; color: #b0c5db; font-size: .77rem; margin: 0 7px 6px; }
    .search { width: 100%; min-height: 42px; border: 1px solid #49617a; color: #f3f8ff; background: #20374f; border-radius: 9px; padding: 9px 11px; }
    .search::placeholder { color: #b0c5db; }
    .search-count { font-size: .74rem; color: #b0c5db; min-height: 25px; margin: 4px 7px 13px; }
    .nav-primary { display: grid; gap: 3px; padding-bottom: 16px; border-bottom: 1px solid #344a63; }
    .nav-link { display: block; padding: 8px 10px; border-radius: 7px; font-size: .84rem; }
    .nav-link:hover { background: #203a55; text-decoration: none; }
    .nav-link[aria-current="page"] { background: #265268; color: #fff; }
    .nav-heading { margin: 20px 10px 6px; font-size: .7rem; letter-spacing: .09em; color: #95aec7; }
    .nav-module { font-size: .79rem; padding: 6px 10px; }
    main { min-width: 0; padding: 32px 38px 72px; scroll-margin-top: 82px; }
    .content { max-width: 1130px; margin: auto; }
    .eyebrow { color: var(--teal); font-size: .72rem; letter-spacing: .15em; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
    .lead { color: var(--muted); max-width: 760px; margin-top: 16px; font-size: .99rem; }
    .hero { background: radial-gradient(ellipse at 90% 0%, #224d64, #14283e 65%); color: #f7fbff; border-radius: 22px; padding: 34px; overflow: hidden; position: relative; }
    .hero .eyebrow { color: #a2ded5; }
    .hero .lead { color: #c3d5e6; max-width: 680px; }
    .hero-line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 30px; }
    .hero-line a { color: #d9f7f3; border: 1px solid #476d7f; padding: 8px 13px; border-radius: 9px; background: #1c3b51; font-size: .86rem; }
    .hero-line a:hover { background: #28596a; text-decoration: none; }
    .hero-line span { color: #8caebf; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 23px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; border-radius: 9px; font-size: .84rem; font-weight: 600; }
    .button:hover { background: var(--blue-soft); text-decoration: none; }
    .button.primary { color: white; background: var(--teal); border-color: var(--teal); }
    .button.primary:hover { background: #09575d; }
    .hero .button.primary { color: #12363c; background: #a6e7dc; border-color: #a6e7dc; }
    .hero .button.secondary { background: transparent; color: #e1edf8; border-color: #627b92; }
    .section { margin-top: 32px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
    .caption { color: var(--muted); font-size: .8rem; }
    .three-grid, .module-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 21px; box-shadow: var(--shadow); }
    .route-card { display: block; color: var(--ink); transition: transform .15s, border-color .15s; }
    .route-card:hover { border-color: #65a5ad; transform: translateY(-2px); text-decoration: none; }
    .route-card p { color: var(--muted); font-size: .83rem; margin-top: 9px; }
    .route-number { color: var(--teal); background: var(--teal-soft); display: inline-grid; place-items: center; width: 29px; height: 29px; border-radius: 8px; font-size: .77rem; font-weight: 700; margin-bottom: 13px; }
    .route-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .route-chips a { font-size: .72rem; padding: 3px 7px; background: var(--paper); border-radius: 5px; }
    .blueprint { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 25px; box-shadow: var(--shadow); }
    .map-layer { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 14px; align-items: start; padding: 16px 0; border-bottom: 1px dashed var(--line); }
    .map-layer:last-child { border-bottom: 0; }
    .layer-name { font-size: .76rem; color: var(--muted); padding-top: 10px; }
    .map-nodes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .map-node { display: block; color: var(--ink); padding: 12px 13px; border: 1px solid var(--line); border-radius: 9px; background: #fafcfe; transition: border-color .15s, background .15s; min-width: 0; }
    .map-node:hover { background: var(--teal-soft); border-color: #82b2b4; text-decoration: none; }
    .map-node strong { display: block; font-size: .79rem; }
    .map-node small { display: block; font-family: Consolas, monospace; font-size: .68rem; color: var(--muted); overflow-wrap: anywhere; margin-top: 4px; }
    .map-node[data-core="true"] { background: #edf5fa; border-color: #b7cedf; }
    .muted-box { padding: 14px 17px; border-radius: 10px; background: var(--blue-soft); color: #344d7b; font-size: .82rem; margin-top: 16px; }
    .breadcrumbs { display: flex; gap: 9px; flex-wrap: wrap; color: var(--muted); font-size: .78rem; margin-bottom: 24px; }
    .module-heading { display: flex; align-items: flex-start; gap: 18px; }
    .chapter-index { display: grid; place-items: center; flex: 0 0 54px; height: 54px; background: var(--teal-soft); color: var(--teal); font-family: Consolas, monospace; font-weight: 700; font-size: 1.4rem; border-radius: 15px; }
    .module-heading .eyebrow { margin: 0 0 7px; }
    .module-heading h1 { font-size: clamp(1.6rem, 3vw, 2.25rem); }
    .symbol { font-family: Consolas, monospace; color: var(--muted); font-size: .83rem; margin-top: 11px; overflow-wrap: anywhere; }
    .explain-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 17px; }
    .prose { color: #324a62; font-size: .9rem; }
    .prose h2 { color: var(--ink); margin-bottom: 13px; }
    .example { background: #eaf4f3; border-color: #c4dedb; }
    .example-label { font-size: .7rem; font-weight: 700; color: #245d60; margin-bottom: 7px; letter-spacing: .07em; }
    .example-value { font-size: .85rem; color: #244a52; overflow-wrap: anywhere; }
    .example-arrow { padding: 10px 0; color: #488f91; font-size: 1.3rem; }
    .step-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-bottom: 14px; }
    .step-button { padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); text-align: left; min-width: 0; color: var(--ink); }
    .step-button span { display: block; font-family: Consolas, monospace; font-size: .71rem; color: var(--muted); margin-bottom: 5px; }
    .step-button strong { font-size: .81rem; }
    .step-button[aria-pressed="true"] { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
    .step-detail { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; min-height: 135px; background: var(--nav); color: #e5eef8; padding: 22px; border-radius: 13px; }
    .step-detail p { font-size: .86rem; color: #c5d6e8; margin-top: 6px; }
    .state-code { color: #b5e8dd; font-size: .81rem; font-family: Consolas, monospace; overflow-wrap: anywhere; align-self: center; padding-left: 20px; border-left: 1px solid #456075; }
    .state-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .state-table th, .state-table td { text-align: left; vertical-align: top; padding: 11px 8px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    .state-table th { width: 34%; color: var(--teal); font-weight: 600; }
    .boundary { background: var(--amber-soft); color: #744814; border: 1px solid #f0d9ae; padding: 16px 19px; border-radius: 12px; font-size: .85rem; margin-top: 16px; }
    .boundary strong { display: block; font-size: .77rem; margin-bottom: 5px; }
    .source { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
    .source summary { cursor: pointer; padding: 15px 18px; font-size: .85rem; overflow-wrap: anywhere; }
    .source summary small { display: inline; color: var(--muted); margin-left: 10px; }
    .source-note { padding: 0 18px 13px; font-size: .83rem; color: var(--muted); }
    .source pre { margin: 0; background: var(--code); color: #d7e7f5; padding: 17px 16px; overflow-x: auto; font-size: .76rem; line-height: 1.7; tab-size: 4; }
    .code-line { display: grid; grid-template-columns: 38px max-content; }
    .line-number { color: #8ea6bf; user-select: none; }
    .code-text { white-space: pre; }
    .source-footer { padding: 12px 18px; display: flex; gap: 14px; flex-wrap: wrap; font-size: .76rem; }
    .test-list { display: grid; gap: 11px; }
    .test-entry { padding: 16px 19px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid #5d9e98; border-radius: 10px; min-width: 0; }
    .test-entry a { font-size: .81rem; overflow-wrap: anywhere; }
    .test-entry p { font-size: .82rem; color: var(--muted); margin-top: 5px; }
    .question { border: 1px solid #c5d6e8; border-radius: 12px; background: #eef4fa; padding: 16px 19px; }
    .question summary { cursor: pointer; color: #244969; font-size: .88rem; }
    .question p { color: #3e5971; font-size: .87rem; padding-top: 13px; }
    .related { display: flex; flex-wrap: wrap; gap: 9px; }
    .flow-menu { display: flex; flex-wrap: wrap; gap: 9px; margin: 22px 0; }
    .flow-menu a[aria-current="page"] { background: var(--teal); color: white; border-color: var(--teal); }
    .flow-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; }
    .flow-timeline { display: grid; align-content: start; gap: 6px; }
    .flow-stop { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; border-radius: 8px; background: transparent; color: var(--muted); text-align: left; padding: 10px 9px; font-size: .8rem; }
    .flow-stop .step-dot { display: grid; place-items: center; width: 25px; height: 25px; flex-shrink: 0; background: #dce6ef; color: #4a637d; border-radius: 50%; font-size: .69rem; }
    .flow-stop[aria-current="step"] { background: var(--teal-soft); color: var(--teal); font-weight: 600; }
    .flow-stop[aria-current="step"] .step-dot { background: var(--teal); color: white; }
    .flow-scene { background: var(--nav); border-radius: 16px; padding: 24px; color: #edf6ff; min-height: 200px; display: flex; flex-direction: column; justify-content: space-between; }
    .scene-title { font-size: 1.16rem; }
    .flow-lanes { display: flex; gap: 8px; justify-content: space-between; margin-top: 21px; }
    .flow-lane { padding: 10px 8px; border: 1px solid #52687e; border-radius: 8px; text-align: center; flex: 1; font-size: .74rem; color: #adc4d9; }
    .flow-lane.active { border-color: #a6e5d9; background: #2b5a65; color: #e7fff9; box-shadow: 0 0 0 3px rgba(146, 224, 211, .08); }
    .flow-scene .caption { color: #b3ccdf; margin-top: 15px; }
    .io-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .io-label { color: var(--teal); font-size: .74rem; font-weight: 700; margin-bottom: 7px; }
    .io-text { font-size: .85rem; color: #3f5870; overflow-wrap: anywhere; }
    .metric-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
    .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
    .metric small { display: block; color: var(--muted); font-size: .69rem; }
    .metric strong { display: block; font-size: .85rem; font-family: Consolas, monospace; margin-top: 6px; color: var(--teal); overflow-wrap: anywhere; }
    .flow-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .flow-position { color: var(--muted); font-size: .78rem; margin-left: auto; }
    .glossary { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 26px; }
    .glossary dt { font-weight: 700; color: var(--teal); font-size: .92rem; }
    .glossary dd { margin: 8px 0 12px; font-size: .86rem; color: var(--muted); }
    .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: .76rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .empty { padding: 22px; background: var(--amber-soft); border-radius: 12px; color: var(--amber); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 1200px) {
      .shell { grid-template-columns: 218px minmax(0, 1fr); }
      main { padding: 27px 25px 60px; }
      .three-grid { grid-template-columns: 1fr; }
      .route-card { padding: 18px 21px; }
      .route-number { float: left; margin: 1px 14px 8px 0; }
      .route-chips { clear: both; }
      .flow-layout { grid-template-columns: 210px minmax(0, 1fr); }
    }
    @media (max-width: 980px) {
      .topbar { padding: 0 18px; }
      .top-title, .top-meta .pill { display: none; }
      .topbar .nav-toggle { display: inline-flex; margin-left: 8px; }
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; position: static; height: auto; max-height: 65vh; }
      body.nav-open .sidebar { display: block; }
      .explain-grid { grid-template-columns: 1fr; }
      .flow-layout { grid-template-columns: 190px minmax(0, 1fr); }
    }
    @media (max-width: 650px) {
      main { padding: 22px 15px 45px; }
      .hero { padding: 24px 22px; }
      .hero-line { gap: 7px; }
      .hero-line a { padding: 6px 10px; }
      .top-meta > a { display: none; }
      .section-head { align-items: flex-start; flex-direction: column; gap: 5px; }
      .blueprint { padding: 14px; }
      .map-layer { grid-template-columns: 1fr; gap: 8px; padding: 13px 0; }
      .layer-name { padding: 0; }
      .map-nodes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .module-grid { grid-template-columns: 1fr; }
      .step-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .step-detail { grid-template-columns: 1fr; min-height: 180px; }
      .state-code { padding: 10px 0 0; border-left: 0; border-top: 1px solid #456075; }
      .flow-layout { grid-template-columns: 1fr; }
      .flow-timeline { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; }
      .flow-stop { font-size: .73rem; }
      .flow-scene { padding: 19px; }
      .flow-lanes { gap: 5px; }
      .flow-lane { padding: 9px 4px; }
      .io-grid, .glossary { grid-template-columns: 1fr; }
      .metric-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card { padding: 18px; }
      .module-heading { gap: 12px; }
      .chapter-index { width: 44px; flex-basis: 44px; height: 44px; }
      .state-table th { width: 40%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
    @media print { .sidebar, .topbar, .nav-toggle, .flow-controls { display: none; } .shell { display: block; } main { padding: 0; } .card, .source { box-shadow: none; break-inside: avoid; } }
  </style>
</head>

        "completion",
        "customization",
        "delivery",
        "evaluation",
        "observability"
      ]
    }
  ]
}
  </script>
  <script>
    'use strict';
    const guide = JSON.parse(document.getElementById('guide-data').textContent);
    const modules = new Map(guide.modules.map(function (module) { return [module.id, module]; }));
    const groups = Array.from(new Set(guide.modules.map(function (module) { return module.group; })));
    const content = document.getElementById('content');
    const search = document.getElementById('module-search');
    const nav = document.getElementById('module-nav');
    const main = document.getElementById('main');
    const sourceBase = 'https://github.com/Titans23/forgecode/blob/' + guide.revision + '/';
    let playback = null;

    function element(tag, className, text) {
      const result = document.createElement(tag);
      if (className) result.className = className;
      if (text !== undefined) result.textContent = text;
      return result;
    }
    function anchor(text, href, className) {
      const result = element('a', className, text);
      result.href = href;
      return result;
    }
    function sourceLink(source, text) {
      const result = anchor(text, sourceBase + source.path + '#L' + source.line);
      result.target = '_blank';
      result.rel = 'noopener noreferrer';
      return result;
    }
    function section(title, subtitle) {
      const result = element('section', 'section');
      const head = element('div', 'section-head');
      head.append(element('h2', '', title));
      if (subtitle) head.append(element('p', 'caption', subtitle));
      result.append(head);
      return result;
    }
    function footer() {
      const result = element('footer', 'footer');
      result.append(element('span', '', '源码快照 ' + guide.revision.slice(0, 7) + ' · ' + guide.date));
      result.append(anchor('架构说明', './implementation/architecture.md'));
      return result;
    }
    function moduleLink(id, className) {
      return anchor(modules.get(id).title, '#module/' + id, className);
    }
    function buildNavigation() {
      groups.forEach(function (group) {
        const block = element('div', 'nav-group');
        block.dataset.group = group;
        block.append(element('div', 'nav-heading', group));
        guide.modules.filter(function (module) { return module.group === group; }).forEach(function (module) {
          const link = moduleLink(module.id, 'nav-link nav-module');
          link.dataset.module = module.id;
          block.append(link);
        });
        nav.append(block);
      });
    }
    function applySearch() {
      const query = search.value.trim().toLowerCase();
      let matches = 0;
      guide.modules.forEach(function (module) {
        const text = [module.title, module.symbol, module.summary, module.group, module.id].join(' ').toLowerCase();
        const visible = !query || text.includes(query);
        if (visible) matches++;
        document.querySelectorAll('[data-module="' + module.id + '"]').forEach(function (node) { node.hidden = !visible; });
      });
      nav.querySelectorAll('.nav-group').forEach(function (group) {
        group.hidden = !Array.from(group.querySelectorAll('.nav-module')).some(function (node) { return !node.hidden; });
      });
      document.querySelectorAll('.map-layer').forEach(function (group) {
        group.hidden = !Array.from(group.querySelectorAll('.map-node')).some(function (node) { return !node.hidden; });
      });
      document.getElementById('search-count').textContent = query ? matches + ' 个匹配模块' : guide.modules.length + ' 个模块 · 6 个职责分区';
      const empty = document.getElementById('map-empty');
      if (empty) empty.hidden = matches > 0;
    }
    function renderOverview() {
      const hero = element('section', 'hero');
      hero.append(element('p', 'eyebrow', 'A guide to the running system'));
      hero.append(element('h1', '', '走进一次 Agent 请求'));
      hero.append(element('p', 'lead', '从一句需求，到模型与工具的协作，再到验收和交付。点开模块，看输入经过哪些判断、状态如何变化，以及源码里真正发生了什么。'));
      const actions = element('div', 'actions');
      actions.append(anchor('跟随一次请求 →', '#flow/coding', 'button primary'));
      actions.append(anchor('进入核心循环', '#module/runner', 'button secondary'));
      hero.append(actions);
      const chain = element('div', 'hero-line');
      const chainIds = ['entry', 'composition', 'runner', 'tools', 'completion', 'sessions'];
      const chainNames = ['输入', '装配', '模型循环', '工具', '验收', '记录'];
      chainIds.forEach(function (id, index) {
        if (index) chain.append(element('span', '', '→'));
        chain.append(anchor(chainNames[index], '#module/' + id));
      });
      hero.append(chain);
      content.append(hero);

      const journeys = section('选择一条学习路径', '从熟悉的行为进入具体实现');
      const cards = element('div', 'three-grid');
      guide.paths.forEach(function (path, index) {
        const card = element('article', 'card route-card');
        card.append(element('span', 'route-number', String(index + 1).padStart(2, '0')));
        card.append(element('h3', '', path.title));
        card.append(element('p', '', path.text));
        const chips = element('div', 'route-chips');
        path.ids.forEach(function (id) { chips.append(moduleLink(id)); });
        card.append(chips);
        cards.append(card);
      });
      journeys.append(cards);
      content.append(journeys);

      const architecture = section('全局架构', '每个方块都能进入实现讲解');
      const map = element('div', 'blueprint');
      groups.forEach(function (group, index) {
        const layer = element('div', 'map-layer');
        layer.append(element('div', 'layer-name', String(index + 1).padStart(2, '0') + ' / ' + group));
        const nodes = element('div', 'map-nodes');
        guide.modules.filter(function (module) { return module.group === group; }).forEach(function (module) {
          const link = anchor('', '#module/' + module.id, 'map-node');
          link.dataset.module = module.id;
          if (['conversation', 'runner', 'budget'].includes(module.id)) link.dataset.core = 'true';
          link.append(element('strong', '', module.title), element('small', '', module.symbol));
          nodes.append(link);
        });
        layer.append(nodes);
        map.append(layer);
      });
      const empty = element('p', 'empty', '没有匹配的模块。可以试试工具、权限或模型。');
      empty.id = 'map-empty';
      empty.hidden = true;
      map.append(empty);
      architecture.append(map);
      architecture.append(element('p', 'muted-box', '阅读方向 · 入口装配共享内核，工具经过授权后进入相应执行边界；Journal 持续记录各阶段事实，完成检查和独立 grader 按各自范围判分。'));
      content.append(architecture);

      const simulations = section('把结构变成过程', '点击步骤，观察输入、输出和状态');
      const simulationsGrid = element('div', 'module-grid');
      guide.flows.forEach(function (flow) {
        const card = anchor('', '#flow/' + flow.id, 'card route-card');
        card.append(element('h3', '', flow.title), element('p', '', flow.subtitle));
        simulationsGrid.append(card);
      });
      simulations.append(simulationsGrid);
      content.append(simulations, footer());
    }
    function renderSource(source, index) {
      const block = element('details', 'source');
      block.open = index === 0;
      const summary = element('summary', '', source.path);
      summary.append(element('small', '', 'L' + source.line + ' · ' + source.symbol));
      block.append(summary);
      block.append(element('p', 'source-note', source.note));
      const pre = element('pre');
      const code = element('code');
      source.code.split('\n').forEach(function (line, offset) {
        const row = element('span', 'code-line');
        const number = element('span', 'line-number', String(source.line + offset));
        number.setAttribute('aria-hidden', 'true');
        row.append(number, element('span', 'code-text', line || ' '));
        code.append(row);
      });
      pre.append(code);
      block.append(pre);
      const links = element('div', 'source-footer');
      links.append(sourceLink(source, '查看固定版本的完整源码 ↗'));
      links.append(element('span', 'caption', '以上为真实源码节选'));
      block.append(links);
      return block;
    }
    function renderModule(module) {
      const index = guide.modules.indexOf(module);
      const crumbs = element('div', 'breadcrumbs');
      crumbs.append(anchor('全局架构', '#overview'), element('span', '', '/'), element('span', '', module.group));
      content.append(crumbs);
      const heading = element('div', 'module-heading');
      heading.append(element('div', 'chapter-index', String(index + 1).padStart(2, '0')));
      const title = element('div');
      title.append(element('p', 'eyebrow', module.group), element('h1', '', module.title), element('p', 'symbol', module.symbol));
      heading.append(title);
      content.append(heading, element('p', 'lead', module.summary));

      const intro = element('div', 'section explain-grid');
      const description = element('article', 'card prose');
      description.append(element('h2', '', '这个模块负责什么'), element('p', '', module.concept));
      module.implementation.forEach(function (paragraph) { description.append(element('p', '', paragraph)); });
      const example = element('aside', 'card example');
      example.append(element('div', 'example-label', '具体输入'), element('p', 'example-value', module.example[0]),
        element('div', 'example-arrow', '↓'), element('div', 'example-label', '可以观察到的行为'), element('p', 'example-value', module.example[1]));
      intro.append(description, example);
      content.append(intro);

      const process = section('实现怎样一步步发生', '选择一个步骤，跟踪当前状态');
      const strip = element('div', 'step-strip');
      const detail = element('div', 'step-detail');
      detail.setAttribute('aria-live', 'polite');
      function showStep(index) {
        const step = module.steps[index];
        strip.querySelectorAll('button').forEach(function (button, i) { button.setAttribute('aria-pressed', String(i === index)); });
        const body = element('div');
        body.append(element('h3', '', step[0]), element('p', '', step[1]));
        detail.replaceChildren(body, element('div', 'state-code', step[2]));
      }
      module.steps.forEach(function (step, i) {
        const button = element('button', 'step-button');
        button.type = 'button';
        button.append(element('span', '', String(i + 1).padStart(2, '0')), element('strong', '', step[0]));
        button.addEventListener('click', function () { showStep(i); });
        strip.append(button);
      });
      process.append(strip, detail);
      showStep(0);
      content.append(process);

      const states = section('跟踪哪些状态', '读代码时，留意这些值的所有者和变化');
      const table = element('table', 'state-table');
      const body = element('tbody');
      module.states.forEach(function (state) {
        const row = element('tr');
        const key = element('th', '', state[0]);
        key.scope = 'row';
        row.append(key, element('td', '', state[1]));
        body.append(row);
      });
      table.append(body);
      states.append(table);
      const boundary = element('div', 'boundary');
      boundary.append(element('strong', '', '实现边界与失败处理'), document.createTextNode(module.boundary));
      states.append(boundary);
      content.append(states);

      const sources = section('沿真实源码阅读', '先跟踪标出的变量和条件，再展开完整方法');
      module.sources.forEach(function (source, i) { sources.append(renderSource(source, i)); });
      content.append(sources);

      const tests = section('对应的行为测试', '测试入口说明它验证哪一个行为，执行状态以实际运行记录为准');
      const list = element('div', 'test-list');
      module.tests.forEach(function (test) {
        const row = element('article', 'test-entry');
        row.append(sourceLink(test, test.path + ' · ' + test.symbol), element('p', '', test.note));
        list.append(row);
      });
      tests.append(list);
      content.append(tests);

      const check = section('试着解释一次');
      const question = element('details', 'question');
      question.append(element('summary', '', module.question), element('p', '', module.answer));
      check.append(question);
      content.append(check);

      const next = section('继续沿调用关系阅读');
      const related = element('div', 'related');
      module.related.forEach(function (id) { related.append(moduleLink(id, 'button')); });
      related.append(anchor('回到全局架构', '#overview', 'button'));
      next.append(related);
      content.append(next, footer());
    }

    function stopPlayback() {
      if (playback !== null) clearInterval(playback);
      playback = null;
      const play = document.getElementById('play-flow');
      if (play) { play.textContent = '播放流程'; play.setAttribute('aria-pressed', 'false'); }
    }
    function laneFor(id) {
      if (['entry', 'composition', 'plugins'].includes(id)) return '入口';
      if (id === 'models') return '模型';
      if (['tools', 'sandbox', 'permissions', 'mcp'].includes(id)) return '工具';
      if (['sessions', 'observability', 'delivery'].includes(id)) return '记录';
      return '运行时';
    }
    function renderFlow(flow, initialStep) {
      let position = Math.max(0, Math.min(flow.steps.length - 1, Number(initialStep) || 0));
      content.append(element('p', 'eyebrow', '本地流程推演'), element('h1', '', flow.title), element('p', 'lead', flow.description));
      const menu = element('div', 'flow-menu');
      guide.flows.forEach(function (item) {
        const link = anchor(item.title, '#flow/' + item.id, 'button');
        if (item.id === flow.id) link.setAttribute('aria-current', 'page');
        menu.append(link);
      });
      content.append(menu);
      const layout = element('div', 'flow-layout');
      const timeline = element('div', 'flow-timeline');
      timeline.setAttribute('aria-label', '流程步骤');
      const stage = element('div');
      const scene = element('div', 'flow-scene');
      const sceneHead = element('div');
      const sceneNumber = element('p', 'caption');
      const sceneTitle = element('h2', 'scene-title');
      sceneHead.append(sceneNumber, sceneTitle);
      const lanes = element('div', 'flow-lanes');
      ['入口', '运行时', '模型', '工具', '记录'].forEach(function (name) { lanes.append(element('div', 'flow-lane', name)); });
      const sceneText = element('p', 'caption');
      scene.append(sceneHead, lanes, sceneText);
      const io = element('div', 'io-grid');
      const incoming = element('div', 'card');
      const outgoing = element('div', 'card');
      const inputText = element('p', 'io-text');
      const outputText = element('p', 'io-text');
      incoming.append(element('div', 'io-label', '进入这一步'), inputText);
      outgoing.append(element('div', 'io-label', '离开这一步'), outputText);
      io.append(incoming, outgoing);
      const metrics = element('div', 'metric-row');
      const metricValues = [];
      ['模型请求', '工具请求', '代码修订', '验收状态'].forEach(function (name) {
        const cell = element('div', 'metric');
        const value = element('strong');
        cell.append(element('small', '', name), value);
        metrics.append(cell);
        metricValues.push(value);
      });
      const controls = element('div', 'flow-controls');
      const previous = element('button', 'button', '← 上一步');
      const play = element('button', 'button', '播放流程');
      play.id = 'play-flow';
      play.setAttribute('aria-pressed', 'false');
      const next = element('button', 'button primary', '下一步 →');
      const positionText = element('span', 'flow-position');
      controls.append(previous, play, next, positionText);
      const currentModule = element('div', 'actions');
      const live = element('p', 'sr-only');
      live.setAttribute('aria-live', 'polite');
      stage.append(scene, io, metrics, controls, currentModule, live);
      layout.append(timeline, stage);
      content.append(layout);
      function update() {
        const step = flow.steps[position];
        timeline.querySelectorAll('button').forEach(function (button, i) {
          if (i === position) button.setAttribute('aria-current', 'step');
          else button.removeAttribute('aria-current');
        });
        sceneNumber.textContent = 'STEP ' + String(position + 1).padStart(2, '0') + ' / ' + step[9];
        sceneTitle.textContent = step[1];
        sceneText.textContent = step[2];
        lanes.querySelectorAll('.flow-lane').forEach(function (lane) { lane.classList.toggle('active', lane.textContent === laneFor(step[0])); });
        inputText.textContent = step[3];
        outputText.textContent = step[4];
        [step[5], step[6], step[7], step[8]].forEach(function (value, i) { metricValues[i].textContent = String(value); });
        previous.disabled = position === 0;
        next.disabled = position === flow.steps.length - 1;
        positionText.textContent = (position + 1) + ' / ' + flow.steps.length;
        currentModule.replaceChildren(moduleLink(step[0], 'button'));
        live.textContent = '步骤 ' + (position + 1) + '，' + step[1] + '，' + step[8];
        history.replaceState(null, '', '#flow/' + flow.id + '/' + position);
        if (position === flow.steps.length - 1) stopPlayback();
      }
      flow.steps.forEach(function (step, i) {
        const button = element('button', 'flow-stop');
        button.type = 'button';
        button.append(element('span', 'step-dot', String(i + 1)), element('span', '', step[1]));
        button.addEventListener('click', function () { stopPlayback(); position = i; update(); });
        timeline.append(button);
      });
      previous.addEventListener('click', function () { stopPlayback(); position--; update(); });
      next.addEventListener('click', function () { stopPlayback(); position++; update(); });
      play.addEventListener('click', function () {
        if (playback !== null) { stopPlayback(); return; }
        if (position === flow.steps.length - 1) position = 0;
        update();
        play.textContent = '暂停播放';
        play.setAttribute('aria-pressed', 'true');
        playback = setInterval(function () { position++; update(); }, 2300);
      });
      update();
      content.append(element('p', 'muted-box', '这是按当前实现规则编排的教学步骤。界面中的状态值用于说明数据流，真实执行证据见 Journal、验证报告和官方判分。'), footer());
    }
    function renderGlossary() {
      content.append(element('p', 'eyebrow', '把名称对应到行为'), element('h1', '', '术语与状态'),
        element('p', 'lead', '理解一个名词时，同时定位它保存什么、由谁修改、在哪个边界被检查。'));
      const list = element('dl', 'glossary');
      guide.glossary.forEach(function (item) {
        const block = element('div', 'card');
        block.append(element('dt', '', item[0]), element('dd', '', item[1]), moduleLink(item[2]));
        list.append(block);
      });
      content.append(list, footer());
    }
    function render() {
      stopPlayback();
      const parts = location.hash.replace(/^#/, '').split('/');
      const page = parts[0] || 'overview';
      content.replaceChildren();
      if (page === 'module' && modules.has(parts[1])) renderModule(modules.get(parts[1]));
      else if (page === 'flow' && guide.flows.some(function (flow) { return flow.id === parts[1]; })) {
        renderFlow(guide.flows.find(function (flow) { return flow.id === parts[1]; }), parts[2]);
      } else if (page === 'glossary') renderGlossary();
      else {
        if (page !== 'overview' && page !== 'main') content.append(element('p', 'empty', '这个地址没有对应内容，下面是项目全局架构。'));
        renderOverview();
      }
      document.querySelectorAll('.nav-link').forEach(function (link) {
        const active = link.dataset.module ? page === 'module' && link.dataset.module === parts[1] : link.dataset.route === page;
        if (active) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
      });
      document.body.classList.remove('nav-open');
      document.getElementById('nav-toggle').setAttribute('aria-expanded', 'false');
      applySearch();
      document.title = (page === 'module' && modules.has(parts[1]) ? modules.get(parts[1]).title + ' · ' : '') + 'ForgeCode 架构学习手册';
      window.scrollTo({top: 0, behavior: 'instant'});
    }
    document.getElementById('revision-link').href = 'https://github.com/Titans23/forgecode/tree/' + guide.revision;
    document.getElementById('nav-toggle').addEventListener('click', function () {
      const open = document.body.classList.toggle('nav-open');
      this.setAttribute('aria-expanded', String(open));
    });
    search.addEventListener('input', applySearch);
    document.querySelector('.skip').addEventListener('click', function (event) {
      event.preventDefault();
      main.focus({preventScroll: true});
      main.scrollIntoView({block: 'start', behavior: 'instant'});
    });
    window.addEventListener('hashchange', function () { render(); main.focus({preventScroll: true}); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) stopPlayback(); });
    buildNavigation();
    render();
  </script>
</body>
</html>
