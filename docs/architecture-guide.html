  <script>
    'use strict';

    function element(tag, className, text) {
      const result = document.createElement(tag);
      if (className) result.className = className;
      if (text !== undefined) result.textContent = text;
      return result;
    }
    function anchor(text, href, className) {
      const result = element('a', className, text);
      result.href = href;
      return result;
    }
    function sourceLink(source, text) {
      const result = anchor(text, sourceBase + source.path + '#L' + source.line);
      result.target = '_blank';
      result.rel = 'noopener noreferrer';
      return result;
    }
    function section(title, subtitle) {
      const result = element('section', 'section');
      const head = element('div', 'section-head');
      head.append(element('h2', '', title));
      if (subtitle) head.append(element('p', 'caption', subtitle));
      result.append(head);
      return result;
    }
    function footer() {
      const result = element('footer', 'footer');
      result.append(element('span', '', '源码快照 ' + guide.revision.slice(0, 7) + ' · ' + guide.date));
      result.append(anchor('架构说明', './implementation/architecture.md'));
      return result;
    }
    function moduleLink(id, className) {
      return anchor(modules.get(id).title, '#module/' + id, className);
    }
    // Article prose supports inline code and citations, never executable HTML.
    function inline(node, text) {
      const pattern = /`([^`]+)`|\[\[([\w-]+)\]\]/g;
      let offset = 0;
      for (const match of text.matchAll(pattern)) {
        node.append(document.createTextNode(text.slice(offset, match.index)));
        if (match[1]) node.append(element('code', '', match[1]));
        else {
          const source = guide.references[match[2]];
          const number = Object.keys(guide.references).indexOf(match[2]) + 1;
          const link = referenceLink(source, '[' + number + ']');
          link.className = 'citation';
          link.title = source.label;
          link.setAttribute('aria-label', '来源 ' + number + '：' + source.label);
          node.append(link);
        }
        offset = match.index + match[0].length;
      }
      node.append(document.createTextNode(text.slice(offset)));
      return node;
    }
    function referenceLink(source, label) {
      const link = anchor(label || source.label, source.url || sourceBase + source.path + (source.line ? '#L' + source.line : ''));
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      return link;
    }
    function articleHeader(title, kind, summary) {
      const head = element('header', 'article-head');
      head.append(element('p', 'eyebrow', 'ForgeCode Wiki / ' + kind), element('h1', '', title));

      meta.append(element('span', '', '版本 ' + guide.version), element('span', '', '更新于 ' + guide.date),
        anchor('源码 ' + guide.revision.slice(0, 7), 'https://github.com/Titans23/forgecode/tree/' + guide.revision));

    function buildNavigation() {

        const link = anchor(article.navTitle || article.title, '#article/' + article.id, 'nav-link');
        link.dataset.article = article.id;
        document.getElementById('article-nav').append(link);
      });
      groups.forEach(function (group) {
        const block = element('div', 'nav-group');
        block.append(element('div', 'nav-heading', group));
        guide.modules.filter(function (module) { return module.group === group; }).forEach(function (module) {
          const link = moduleLink(module.id, 'nav-link nav-module');
          link.dataset.module = module.id;
          block.append(link);
        });
        nav.append(block);
      });
    }
    function applySearch() {
      const query = search.value.trim().toLowerCase();
      const results = document.getElementById('search-results');
      results.replaceChildren();
      results.hidden = !query;
      document.getElementById('browse-nav').hidden = Boolean(query);
      if (query) {
        searchPages.forEach(function (page) {
          if (!page.text.includes(query)) return;
          const link = anchor('', page.route, 'nav-link search-result');
          link.append(element('span', '', page.title));
          if (page.sections) {
            const match = page.sections.find(function (item) { return JSON.stringify(item).toLowerCase().includes(query); });
            if (match) {
              link.href = page.route + '/' + match.id;
              link.append(element('small', 'search-match', match.title));
            }
          }
          results.append(link);
        });
      }
      const count = results.children.length;
      document.getElementById('search-count').textContent = query
        ? (count ? count + ' 个匹配条目 · 搜索正文与源码' : '没有匹配条目，试试“后台”“缓存”或“插件”。')
        : guide.articles.length + ' 篇主题 · ' + guide.modules.length + ' 个源码模块';
    }
    function renderOverview() {
      articleHeader('ForgeCode 架构 Wiki', '首页', 'ForgeCode 是轻量、可扩展的 Python Agent Harness，用来构建、运行、验证和复用 Agent。Coding Agent 与终端 CLI 是默认应用；业务系统可以在同一内核上组合自己的工具、模型与插件。');

          const link = anchor('', '#module/' + module.id, 'map-node');
          if (['conversation', 'runner', 'usage'].includes(module.id)) link.dataset.core = 'true';

      const links = element('div', 'related');

      maintenance.append(links);

    }
    function renderArticle(article) {
      articleHeader(article.title, '主题条目', article.summary);
      article.sections.forEach(function (item) {
        const block = section(item.title);
        block.id = item.id;
        block.classList.add('wiki-section');
        item.paragraphs.forEach(function (text) { block.append(inline(element('p'), text)); });
        if (item.table) {
          const wrap = element('div', 'wiki-table-wrap');
          wrap.tabIndex = 0;
          wrap.setAttribute('role', 'region');
          wrap.setAttribute('aria-label', item.title + '：对照表，可横向滚动');
          const table = element('table', 'wiki-table');
          const head = element('thead');
          const row = element('tr');
          item.table.headers.forEach(function (label) { const cell = element('th', '', label); cell.scope = 'col'; row.append(cell); });
          head.append(row);
          const body = element('tbody');
          item.table.rows.forEach(function (cells) {
            const row = element('tr');
            cells.forEach(function (text) { row.append(inline(element('td'), text)); });
            body.append(row);
          });
          table.append(element('caption', 'sr-only', item.title), head, body);
          wrap.append(table);
          block.append(wrap);
        }
        if (item.items) {
          const list = element('ul');
          item.items.forEach(function (text) { list.append(inline(element('li'), text)); });
          block.append(list);
        }
        if (item.diagram) {
          const chain = element('ol', 'diagram');
          chain.setAttribute('aria-label', '流程顺序');
          item.diagram.forEach(function (text) { const node = element('li'); node.append(element('span', '', text)); chain.append(node); });
          block.append(chain);
        }
        if (item.code) {
          const figure = element('figure', 'code-example');
          figure.append(element('figcaption', '', item.code.language + ' · ' + item.code.caption));
          const pre = element('pre');
          pre.tabIndex = 0;
          pre.append(element('code', '', item.code.text));
          figure.append(pre);
          block.append(figure);
        }
        if (item.paragraphs_extra) block.append(inline(element('p'), item.paragraphs_extra));
        if (item.example) {
          const example = element('aside', 'callout');
          example.append(element('h3', '', item.example.title), inline(element('p'), item.example.text));
          block.append(example);
        }
        if (item.note) block.append(inline(element('aside', 'callout'), item.note));

          const links = element('div', 'related');
          item.links.forEach(function (link) { links.append(anchor(link[0], link[1])); });

        if (item.references) {

    function renderSource(source, index) {
      const block = element('details', 'source');
      block.open = index === 0;

      block.append(summary);
      block.append(element('p', 'source-note', source.note));
      const pre = element('pre');
      pre.tabIndex = 0;
      const code = element('code');
      source.code.split('\n').forEach(function (line, offset) {
        const row = element('span', 'code-line');

      content.append(tests);

      const check = section('试着解释一次');
      check.id = 'question';
      const question = element('details', 'question');
      question.append(element('summary', '', module.question), element('p', '', module.answer));
      check.append(question);
      content.append(check);

      const next = section('继续沿调用关系阅读');
      next.id = 'related';
      const related = element('div', 'related');
      module.related.forEach(function (id) { related.append(moduleLink(id, 'button')); });
      related.append(anchor('回到全局架构', '#overview', 'button'));
      next.append(related);
      content.append(next, footer());
    }

    function stopPlayback() {
      if (playback !== null) clearInterval(playback);
      playback = null;
      const play = document.getElementById('play-flow');
      if (play) { play.textContent = '播放流程'; play.setAttribute('aria-pressed', 'false'); }
    }
    function laneFor(id) {
      if (['entry', 'composition', 'plugins'].includes(id)) return '入口';
      if (id === 'models') return '模型';
      if (['tools', 'sandbox', 'permissions', 'mcp'].includes(id)) return '工具';
      if (['sessions', 'observability', 'delivery'].includes(id)) return '记录';
      return '运行时';
    }
    function renderFlow(flow, initialStep) {
      let position = Math.max(0, Math.min(flow.steps.length - 1, Number(initialStep) || 0));
      content.append(element('p', 'eyebrow', '本地流程推演'), element('h1', '', flow.title), element('p', 'lead', flow.description));
      const menu = element('div', 'flow-menu');
      guide.flows.forEach(function (item) {
        const link = anchor(item.title, '#flow/' + item.id, 'button');
        if (item.id === flow.id) link.setAttribute('aria-current', 'page');
        menu.append(link);
      });
      content.append(menu);
      const layout = element('div', 'flow-layout');
      const timeline = element('div', 'flow-timeline');
      timeline.setAttribute('aria-label', '流程步骤');
      const stage = element('div');
      const scene = element('div', 'flow-scene');
      const sceneHead = element('div');
      const sceneNumber = element('p', 'caption');
      const sceneTitle = element('h2', 'scene-title');
      sceneHead.append(sceneNumber, sceneTitle);
      const lanes = element('div', 'flow-lanes');
      ['入口', '运行时', '模型', '工具', '记录'].forEach(function (name) { lanes.append(element('div', 'flow-lane', name)); });
      const sceneText = element('p', 'caption');
      scene.append(sceneHead, lanes, sceneText);
      const io = element('div', 'io-grid');
      const incoming = element('div', 'card');
      const outgoing = element('div', 'card');
      const inputText = element('p', 'io-text');
      const outputText = element('p', 'io-text');
      incoming.append(element('div', 'io-label', '进入这一步'), inputText);
      outgoing.append(element('div', 'io-label', '离开这一步'), outputText);
      io.append(incoming, outgoing);
      const metrics = element('div', 'metric-row');
      const metricValues = [];
      ['模型请求', '工具请求', '代码修订', '验收状态'].forEach(function (name) {
        const cell = element('div', 'metric');
        const value = element('strong');
        cell.append(element('small', '', name), value);
        metrics.append(cell);
        metricValues.push(value);
      });
      const controls = element('div', 'flow-controls');
      const previous = element('button', 'button', '← 上一步');
      const play = element('button', 'button', '播放流程');
      play.id = 'play-flow';
      play.setAttribute('aria-pressed', 'false');
      const next = element('button', 'button primary', '下一步 →');
      const positionText = element('span', 'flow-position');
      controls.append(previous, play, next, positionText);
      const currentModule = element('div', 'actions');
      const live = element('p', 'sr-only');
      live.setAttribute('aria-live', 'polite');
      stage.append(scene, io, metrics, controls, currentModule, live);
      layout.append(timeline, stage);
      content.append(layout);
      function update() {
        const step = flow.steps[position];
        timeline.querySelectorAll('button').forEach(function (button, i) {
          if (i === position) button.setAttribute('aria-current', 'step');
          else button.removeAttribute('aria-current');
        });
        sceneNumber.textContent = 'STEP ' + String(position + 1).padStart(2, '0') + ' / ' + step[9];
        sceneTitle.textContent = step[1];
        sceneText.textContent = step[2];
        lanes.querySelectorAll('.flow-lane').forEach(function (lane) { lane.classList.toggle('active', lane.textContent === laneFor(step[0])); });
        inputText.textContent = step[3];
        outputText.textContent = step[4];
        [step[5], step[6], step[7], step[8]].forEach(function (value, i) { metricValues[i].textContent = String(value); });
        previous.disabled = position === 0;
        next.disabled = position === flow.steps.length - 1;
        positionText.textContent = (position + 1) + ' / ' + flow.steps.length;
        currentModule.replaceChildren(moduleLink(step[0], 'button'));
        live.textContent = '步骤 ' + (position + 1) + '，' + step[1] + '，' + step[8];
        history.replaceState(null, '', '#flow/' + flow.id + '/' + position);
        if (position === flow.steps.length - 1) stopPlayback();
      }
      flow.steps.forEach(function (step, i) {
        const button = element('button', 'flow-stop');
        button.type = 'button';
        button.append(element('span', 'step-dot', String(i + 1)), element('span', '', step[1]));
        button.addEventListener('click', function () { stopPlayback(); position = i; update(); });
        timeline.append(button);
      });
      previous.addEventListener('click', function () { stopPlayback(); position--; update(); });
      next.addEventListener('click', function () { stopPlayback(); position++; update(); });
      play.addEventListener('click', function () {
        if (playback !== null) { stopPlayback(); return; }
        if (position === flow.steps.length - 1) position = 0;
        update();
        play.textContent = '暂停播放';
        play.setAttribute('aria-pressed', 'true');
        playback = setInterval(function () { position++; update(); }, 2300);
      });
      update();
      content.append(element('p', 'muted-box', '这是按当前实现规则编排的教学步骤。界面中的状态值用于说明数据流，真实执行证据见 Journal、验证报告和官方判分。'), footer());
    }
    function renderGlossary() {
      content.append(element('p', 'eyebrow', '把名称对应到行为'), element('h1', '', '术语与状态'),
        element('p', 'lead', '理解一个名词时，同时定位它保存什么、由谁修改、在哪个边界被检查。'));
      const list = element('dl', 'glossary');
      guide.glossary.forEach(function (item) {
        const block = element('div', 'card');
        block.append(element('dt', '', item[0]), element('dd', '', item[1]), moduleLink(item[2]));
        list.append(block);
      });
      content.append(list, footer());
    }
    function buildContents(route) {
      const toc = document.getElementById('toc-links');
      toc.replaceChildren();
      if (route.startsWith('#flow')) { document.getElementById('page-toc').hidden = true; return; }
      content.querySelectorAll('h2').forEach(function (heading, index) {
        const block = heading.closest('section') || heading.parentElement;
        const id = block.id || 'section-' + (index + 1);
        block.id = id;
        const href = route + '/' + id;
        toc.append(anchor(heading.textContent, href, 'toc-link'));
        const permalink = anchor('§', href, 'permalink');
        permalink.setAttribute('aria-label', '链接到：' + heading.textContent);
        heading.append(permalink);
      });
      document.getElementById('page-toc').hidden = !toc.children.length || route.startsWith('#flow');
      document.getElementById('toc-details').open = window.matchMedia('(min-width: 1181px)').matches;
    }
    function scrollToSection(id) {
      const target = id ? document.getElementById(id) : null;
      if (target && content.contains(target)) target.scrollIntoView({block: 'start', behavior: 'instant'});
      else window.scrollTo({top: 0, behavior: 'instant'});
      document.querySelectorAll('.toc-link').forEach(function (link) {
        if (id && link.hash.endsWith('/' + id)) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
    }
    function render() {
      const parts = location.hash.replace(/^#/, '').split('/');
      const page = parts[0] || 'overview';
      const route = '#' + (['module', 'article', 'flow'].includes(page) ? page + '/' + parts[1] : page);
      const sectionId = ['module', 'article'].includes(page) ? parts[2] : parts[1];
      document.body.classList.remove('nav-open');
      document.getElementById('nav-toggle').setAttribute('aria-expanded', 'false');
      if (renderedRoute === route && page !== 'flow') { scrollToSection(sectionId); return; }
      stopPlayback();
      content.replaceChildren();
      if (page === 'module' && modules.has(parts[1])) renderModule(modules.get(parts[1]));
      else if (page === 'article' && articles.has(parts[1])) renderArticle(articles.get(parts[1]));
      else if (page === 'flow' && guide.flows.some(function (flow) { return flow.id === parts[1]; })) {
        renderFlow(guide.flows.find(function (flow) { return flow.id === parts[1]; }), parts[2]);
      } else if (page === 'glossary') renderGlossary();
      else {
        if (page !== 'overview' && page !== 'main') content.append(element('p', 'empty', '这个地址没有对应条目，可以从首页或搜索继续。'));
        renderOverview();
      }
      renderedRoute = route;
      document.querySelectorAll('.nav-link').forEach(function (link) {
        const active = link.dataset.module ? page === 'module' && link.dataset.module === parts[1]
          : link.dataset.article ? page === 'article' && link.dataset.article === parts[1] : link.dataset.route === page;
        if (active) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
      });
      applySearch();
      document.title = content.querySelector('h1').textContent + ' · ForgeCode ' + guide.version;
      buildContents(route);
      scrollToSection(page === 'flow' ? null : sectionId);
    }
    const revisionLink = document.getElementById('revision-link');
    revisionLink.href = 'https://github.com/Titans23/forgecode/tree/' + guide.revision;
    revisionLink.textContent = 'v' + guide.version + ' · ' + guide.revision.slice(0, 7);
    document.getElementById('nav-toggle').addEventListener('click', function () {
      const open = document.body.classList.toggle('nav-open');
      this.setAttribute('aria-expanded', String(open));
      if (open) search.focus();
    });
    search.addEventListener('input', applySearch);
    document.addEventListener('click', function (event) {
      const link = event.target.closest('a[href^="#"]');
      if (link && link.hash === location.hash) {
        event.preventDefault();
        render();
        main.focus({preventScroll: true});
      }
    });
    search.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') { search.value = ''; applySearch(); }
      if (event.key === 'Enter') {
        const first = document.querySelector('.search-result');
        if (first) { event.preventDefault(); first.click(); }
      }
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === '/' && !event.ctrlKey && !event.altKey && !event.metaKey
          && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        event.preventDefault();
        document.body.classList.add('nav-open');
        document.getElementById('nav-toggle').setAttribute('aria-expanded', 'true');
        search.focus();
      }
    });
    document.querySelector('.skip').addEventListener('click', function (event) {
      event.preventDefault();
      main.focus({preventScroll: true});
      main.scrollIntoView({block: 'start', behavior: 'instant'});
    });
    window.addEventListener('hashchange', function () { render(); main.focus({preventScroll: true}); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) stopPlayback(); });
    buildNavigation();
    render();
  </script>
</body>
</html>
